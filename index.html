<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="REKINDLE — the suns have gone cold. Gather light, wake the machines, and reignite a dead system. A narrative incremental with an arcade heart.">
<title>REKINDLE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sunWrap">
  <canvas id="sunCanvas"></canvas>
  <div id="actName"></div>
  <div id="actTag"></div>
  <div id="seedBadge" hidden></div>
  <div id="tickerLog"></div>
</div>

<div id="resBar"></div>
<div id="tabs"></div>
<div id="main"></div>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="ending" hidden></div>

<div id="arcadeOverlay" hidden>
  <canvas id="game"></canvas>
</div>

<script>window.__arcadeSleeping = true;</script>
<script src="game.js"></script>
<script src="rekindle.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
